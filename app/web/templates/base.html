<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block title %}Daňová evidence{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Evidence">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f5d8a">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/branding/theme.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="topbar">
    <a class="brand" href="/">
      {% if has_logo %}<img src="/branding/logo" alt="" class="brand-logo">{% endif %}
      <span>{{ firma.firma.nazev or "Daňová evidence" }}</span>
    </a>
    {% if logged_in %}
    <nav class="nav" aria-label="Hlavní menu">
      <a href="/">Přehled</a>
      <a href="/faktury">Faktury</a>
      <a href="/doklady">Doklady</a>
      <a href="/denik">Deník</a>
      <a href="/banka">Banka</a>
      <a href="/zakazky">Zakázky</a>
      <a href="/kontakty">Kontakty</a>
      <a href="/nastaveni">Nastavení</a>
      <form method="post" action="/odhlaseni" class="inline">
        <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
        <button type="submit" class="link">Odhlásit</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Daňová evidence {{ app_version }} · software bez záruky, nenahrazuje daňového poradce</footer>
</body>
</html>
