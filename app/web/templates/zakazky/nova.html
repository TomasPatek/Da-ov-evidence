{% extends "base.html" %}
{% block title %}Nová zakázka · Daňová evidence{% endblock %}
{% block content %}
<p class="crumbs"><a href="/zakazky">Zakázky</a></p>
<h1>Nová zakázka</h1>
<section class="card">
  {% include "_errors.html" %}
  <form method="post" action="/zakazky/nova">
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    {% include "zakazky/_pole.html" %}
    <button type="submit" class="primary">Založit zakázku</button>
  </form>
</section>
{% endblock %}
