{# Correct the number of a cash voucher (PPD/VPD). Needs `e` and `back`. #}
<details class="inline-details">
  <summary>Opravit číslo</summary>
  <form method="post" action="/denik/{{ e.id }}/cislo" class="inline-form">
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    <input type="hidden" name="zpet" value="{{ back }}">
    <label>Číslo {{ "PPD" if e.smer == "příjem" else "VPD" }} <span class="muted">(např. podle papírového dokladu)</span>
      <input type="text" name="cislo" value="{{ e.cislo_dokladu }}" maxlength="20" required autocomplete="off"
             pattern="\s*([PpVv][Pp][Dd])?\s*[1-9][0-9]{0,4}\s*(/\s*[0-9]{2})?\s*">
    </label>
    <button type="submit">Uložit</button>
  </form>
</details>
