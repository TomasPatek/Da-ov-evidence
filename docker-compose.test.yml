# Test services for integration tests (SMTP from phase 1, IMAP from phase 3).
#   docker compose -f docker-compose.test.yml up -d

services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI + API

  greenmail:
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.verbose
    ports:
      - "3025:3025"   # SMTP (delivering test mails)
      - "3143:3143"   # IMAP
      - "3993:3993"   # IMAPS
