# Daňová evidence. Návod: docs/instalace-server.md a docs/instalace-lokalne.md
#
#   docker compose up -d     # aplikace na http://<adresa-serveru>:8000, jen v lokální síti

name: danova-evidence

services:
  app:
    # By default the image is built locally from this repository. To use a released image
    # instead, set APP_IMAGE=ghcr.io/tomaspatek/danova-evidence:1.1.0 and APP_PULL_POLICY=missing
    # in .env (docs/instalace-server.md).
    image: ${APP_IMAGE:-danova-evidence:local}
    build: .
    pull_policy: ${APP_PULL_POLICY:-build}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /config
    volumes:
      - ./data:/data
      - ./config:/config
    ports:
      - "${APP_PORT:-8000}:8000"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

