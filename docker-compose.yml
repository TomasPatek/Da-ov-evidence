# Daňová evidence. Návod: docs/instalace-server.md a docs/instalace-lokalne.md
#
#   docker compose up -d                    # aplikace na http://<server>:8000
#   docker compose --profile proxy up -d    # navíc reverzní proxy Caddy s HTTPS

services:
  app:
    image: ghcr.io/tomaspatek/danova-evidence:${APP_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /config
    volumes:
      - ./data:/data
      - ./config:/config
    ports:
      - "${APP_PORT:-8000}:8000"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["proxy"]
    build:
      context: ./proxy
      args:
        DNS_PROVIDER: ${DNS_PROVIDER:-cloudflare}
    restart: unless-stopped
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
