# Daňová evidence. Návod: docs/instalace-server.md a docs/instalace-lokalne.md
#
#   docker compose up -d     # aplikace na http://<adresa-serveru>:8000, jen v lokální síti

name: danova-evidence

services:
  app:
    # Until the first release the image is built locally from this repository.
    image: danova-evidence:local
    build: .
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /config
    volumes:
      - ./data:/data
      - ./config:/config
    ports:
      - "${APP_PORT:-8000}:8000"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

