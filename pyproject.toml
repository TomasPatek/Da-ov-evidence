[project]
name = "danova-evidence"
version = "1.0.0"
description = "Self-hosted daňová evidence pro OSVČ, neplátce DPH"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "weasyprint>=70.0",
    "segno>=1.6.6",
    "pyzbar>=0.1.9",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.1",
    "defusedxml>=0.7.1",
    "imap-tools>=1.16.0",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
    "pdfplumber>=0.11.10",
    "lxml>=6.1.3",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Czech text contains look-alike characters

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"scripts/**" = ["S105", "S106"]
"scripts/make_ingest_fixtures.py" = ["E501", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["argon2.*", "weasyprint.*", "pypdfium2.*", "pyzbar.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: tests calling real external services (disabled in CI)",
    "e2e: browser end-to-end tests (Playwright)",
]
addopts = "-m 'not live and not e2e'"

[tool.coverage.run]
source = ["app"]
