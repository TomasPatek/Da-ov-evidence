name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: docs/csv-format.md up to date
        run: uv run python -m app.storage.docs --check

  test:
    runs-on: ubuntu-latest
    services:
      # SMTP test server from docker-compose.test.yml.
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
      # IMAP test server from docker-compose.test.yml.
      greenmail:
        image: greenmail/standalone:2.1.2
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled -Dgreenmail.verbose
        ports: ["3025:3025", "3143:3143"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: system libraries (PDF, QR reader)
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core libzbar0
      - run: uv sync --frozen
      - name: unit + integration tests
        env:
          MAILPIT_URL: http://127.0.0.1:8025
          GREENMAIL_HOST: 127.0.0.1
        run: uv run pytest --cov=app --cov-report=term
      - name: coverage >= 90 % for money-critical modules
        run: >-
          uv run coverage report --fail-under=90
          --include='app/money.py,app/storage/*,app/banks/*,app/tax/*,app/invoices/*'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: system libraries (PDF, QR reader)
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core libzbar0
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e tests/e2e

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke test (steps from docs/instalace-server.md)
        run: |
          mkdir -p data config
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -base64 48)|" .env
          sed -i "s|^APP_UID=.*|APP_UID=$(id -u)|; s|^APP_GID=.*|APP_GID=$(id -g)|" .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/zdravi && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/zdravi
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/ | grep -q 303
          docker compose logs app | grep -q "kód pro nastavení hesla"
          # The container must not be able to write outside /data and /config.
          if docker compose exec -T app touch /app/test-write; then
            echo "root filesystem is writable"; exit 1
          fi
          docker compose exec -T app touch /data/test-write /config/test-write
          # PDF rendering needs system libraries inside the image.
          docker compose exec -T app python -c "from weasyprint import HTML; assert HTML(string='<p>Příliš žluťoučký</p>').write_pdf().startswith(b'%PDF')"
          # QR reading of received documents needs libzbar inside the image.
          docker compose exec -T app python -c "from pyzbar.pyzbar import decode; print('zbar ok')"
      - name: logs on failure
        if: failure()
        run: docker compose logs
      - name: tear down
        if: always()
        run: docker compose down -v
